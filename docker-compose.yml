version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: eeg-postgres
    environment:
      POSTGRES_USER: eeg_user
      POSTGRES_PASSWORD: eeg_password
      POSTGRES_DB: eeg_monitoring
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eeg_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eeg-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://eeg_user:eeg_password@db:5432/eeg_monitoring
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # React Dashboard (development mode)
  dashboard:
    image: node:18-alpine
    container_name: eeg-dashboard
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
